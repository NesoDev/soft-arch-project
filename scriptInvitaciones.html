<script>
  function cargarDepartamentosParaInvitaciones() {
    google.script.run.withSuccessHandler(function(departamentos) {
      var select = document.getElementById("departamentoSeleccionado");
      select.innerHTML = "<option value=''>Seleccione un departamento</option>";
      
      departamentos.forEach(function(depto) {
        var option = document.createElement("option");
        option.value = depto.id;
        option.textContent = depto.nombre;
        select.appendChild(option);
      });
    }).getDepartamentosParaInvitaciones();
  }

  function mostrarFormularioInvitacion(accion) {
    var form = document.getElementById("formularioInvitacion");
    form.style.display = "block";
    
    if (accion === 'enviarInv') {
      form.innerHTML = `
        <h3>📩 Enviar Invitación</h3>
        <label>Correo del Inquilino:</label> <input type="email" id="emailInquilino" placeholder="Ingrese correo"><br><br>
        <label>Seleccione un Departamento:</label> <select id="departamentoSeleccionado"></select><br><br>
        <button onclick="enviarInvitacion()">Enviar</button>
        <button onclick="ocultarFormularioInvitacion()">Cancelar</button>
      `;
      cargarDepartamentosParaInvitaciones();
    } else if (accion === 'cancelarInv') {
      form.innerHTML = "<h3>❌ Seleccione una invitación para cancelar</h3>";
    }
  }

  function ocultarFormularioInvitacion() {
    document.getElementById("formularioInvitacion").style.display = "none";
  }

  function enviarInvitacion() {
    var emailInquilino = document.getElementById("emailInquilino").value.trim();
    var idDepartamento = document.getElementById("departamentoSeleccionado").value;
    
    if (!emailInquilino || !idDepartamento) {
      alert("⚠️ Debe ingresar un correo de inquilino y seleccionar un departamento.");
      return;
    }
    
    google.script.run.withSuccessHandler(function(msg) {
      alert(msg);
      cargarInvitaciones();
    }).enviarInvitacion(idDepartamento, emailInquilino);
  }


function cargarInvitaciones() {
  console.log("📢 Enviando solicitud a obtenerInvitaciones()...");

  google.script.run
    .withSuccessHandler(function(respuesta) {
      console.log("✅ Respuesta recibida del backend:", respuesta);

      if (!respuesta) {
        console.warn("⚠️ Error: Respuesta inválida, mostrando el mensaje recibido.", respuesta);
        alert("⚠️ Respuesta inesperada: " + JSON.stringify(respuesta));
        return;
      }

      try {
        var invitaciones = typeof respuesta === "string" ? JSON.parse(respuesta) : respuesta;
      } catch (error) {
        console.error("❌ Error al parsear la respuesta JSON:", error);
        alert("❌ Error procesando la respuesta del servidor.");
        return;
      }

      var lista = document.getElementById("listaInvitaciones");
      lista.innerHTML = "";

      if (invitaciones[0]?.mensaje) {
        lista.innerHTML = `<li>${invitaciones[0].mensaje}</li>`;
        return;
      }

      invitaciones.forEach(function(inv) {
        var li = document.createElement("li");
        li.innerHTML = `ID: ${inv.id} - Departamento: ${inv.departamento} - Estado: ${inv.estado}`;

        if (inv.estado === "Pendiente") {
          var btnCancelar = document.createElement("button");
          btnCancelar.textContent = "Cancelar";
          btnCancelar.onclick = function() { cancelarInvitacion(inv.id); };
          li.appendChild(btnCancelar);
        }

        lista.appendChild(li);
      });
    })
    .withFailureHandler(function(error) {
      console.error("❌ Error en la conexión con el backend:", error);
      alert("❌ Error en la conexión con el servidor: " + JSON.stringify(error));
    })
    .obtenerInvitaciones();
}






  function cancelarInvitacion(idInvitacion) {
    google.script.run.withSuccessHandler(function(msg) {
      alert(msg);
      cargarInvitaciones();
    }).cancelarInvitacion(idInvitacion);
  }

  window.onload = function() {
    cargarDepartamentosParaInvitaciones();
    cargarInvitaciones();
  };
</script>
