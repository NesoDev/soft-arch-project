<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      h3 {
        text-align: center;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }
      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        margin-top: 15px;
        width: 100%;
        font-size: 16px;
        border-radius: 5px;
      }
      button:hover {
        background-color: #45a049;
      }
    </style>
    <script>
      function enviarEdicion() {
        var formData = {
          id: document.getElementById("id").value,
          nombre: document.getElementById("nombre").value,
          calle: document.getElementById("calle").value,
          numero: document.getElementById("numero").value,
          distrito: document.getElementById("distrito").value,
          ciudad: document.getElementById("ciudad").value,
          codigoPostal: document.getElementById("codigoPostal").value,
          referencia: document.getElementById("referencia").value,
          cantidadDepartamentos: document.getElementById("cantidadDepartamentos").value,
          area: document.getElementById("area").value,
          servicios: document.getElementById("servicios").value,
          pisos: document.getElementById("pisos").value,
          estacionamiento: document.getElementById("estacionamiento").value,
          foto: document.getElementById("foto").value
        };

        google.script.run.procesarEdicionPropiedad(formData);
        google.script.host.close(); 
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h3>Editar Propiedad</h3>
      <input type="hidden" id="id" value="<?= id ?>">

      <label>Nombre:</label>
      <input type="text" id="nombre" value="<?= nombre ?>">

      <label>Calle:</label>
      <input type="text" id="calle" value="<?= calle ?>">

      <label>Número:</label>
      <input type="number" id="numero" value="<?= numero ?>">

      <label>Distrito:</label>
      <input type="text" id="distrito" value="<?= distrito ?>">

      <label>Ciudad:</label>
      <input type="text" id="ciudad" value="<?= ciudad ?>">

      <label>Código Postal:</label>
      <input type="number" id="codigoPostal" value="<?= codigoPostal ?>">

      <label>Referencia:</label>
      <input type="text" id="referencia" value="<?= referencia ?>">

      <label>Cantidad de Departamentos:</label>
      <input type="number" id="cantidadDepartamentos" value="<?= cantidadDepartamentos ?>">

      <label>Área (m²):</label>
      <input type="number" id="area" value="<?= area ?>">

      <label>Servicios:</label>
      <input type="text" id="servicios" value="<?= servicios ?>">

      <label>Nro. Pisos:</label>
      <input type="number" id="pisos" value="<?= pisos ?>">

      <label>Estacionamiento:</label>
      <input type="text" id="estacionamiento" value="<?= estacionamiento ?>">

      <label>Foto (URL):</label>
      <input type="text" id="foto" value="<?= foto ?>">
      
      <button onclick="enviarEdicion()">Guardar Cambios</button>
    </div>
  </body>
</html>
