<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <h1>Gestión de Usuarios</h1>
    <input type="text" id="search" placeholder="Buscar por nombre o rol...">
    <button onclick="searchUsers()">Buscar</button>
    <ul id="userList"></ul>

    <script>
      function searchUsers() {
        const query = document.getElementById("search").value;
        google.script.run.withSuccessHandler(updateUserList).searchUsers(query);
      }

      function updateUserList(users) {
        const userList = document.getElementById("userList");
        userList.innerHTML = "";
        users.forEach(user => {
          const li = document.createElement("li");
          li.textContent = `${user.Nombre} - ${user.Rol} (${user["Correo electrónico"]})`;
          const deleteButton = document.createElement("button");
          deleteButton.textContent = "Eliminar";
          deleteButton.onclick = () => deleteUser(user["Correo electrónico"]);
          li.appendChild(deleteButton);
          userList.appendChild(li);
        });
      }

      function deleteUser(email) {
        if (confirm("¿Estás seguro de eliminar este usuario?")) {
          google.script.run.deleteUser(email);
          searchUsers(); // Actualizar la lista después de eliminar
        }
      }

      // Cargar usuarios al iniciar
      window.onload = searchUsers;
    </script>
  </body>
</html>
