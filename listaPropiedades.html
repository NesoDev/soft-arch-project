<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Propiedades</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 400px;
            margin: 0 auto;
        }

        li {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
    <script>
        function cargarPropiedades() {
            var propiedades = JSON.parse(<?= propiedades ?>);
            var lista = document.getElementById("listaPropiedades");

            propiedades.forEach(propiedad => {
                var item = document.createElement("li");
                item.innerHTML = `${propiedad.nombre} 
                    <button onclick="mostrarDepartamentos('${propiedad.id}')">Ver Departamentos</button>`;
                lista.appendChild(item);
            });
        }

        function mostrarDepartamentos(idPropiedad) {
            google.script.run.filtrarDepartamentos(idPropiedad);
            google.script.host.close();
        }
    </script>
</head>
<body onload="cargarPropiedades()">
    <h2>Lista de Propiedades</h2>
    <ul id="listaPropiedades"></ul>
</body>
</html>
